name: Refresh WorldStream catalog
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate entertainment catalog
        timeout-minutes: 25
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python updater.py
      - name: Commit refreshed catalog
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json public/discovery_report.json public/diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh movie and TV metadata"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

